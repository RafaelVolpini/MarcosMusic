## ── Perfil DEV — Postgres local ──────────────────────────────────────────
## Requer um Postgres rodando localmente (recomendado, ver README/Docker abaixo).
## Se preferir nao instalar nada, troque para H2 — ver comentario no final do arquivo.
spring.datasource.url=jdbc:postgresql://localhost:5432/marcosmusic_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

## Segredos de teste — servem só para a app subir localmente. Nunca reutilizar em produção.
jwt.secret=dev-only-secret-nao-usar-em-producao-troque-isto-1234567890
spring.mail.username=dev@example.com
spring.mail.password=dev-app-password

## URL do frontend local (usada no link de reset de senha enviado por email)
app.frontend.url=http://localhost:5173

## CORS liberado para o Vite dev server (portas variam conforme o Vite sobe)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176

## ─────────────────────────────────────────────────────────────────────────
## Alternativa sem instalar Postgres: comente o bloco acima e descomente este,
## usando H2 em modo compatibilidade Postgres. Ressalva: as migrations usam
## gen_random_uuid()/pgcrypto e alguns tipos que o H2 nao replica 100% —
## pode ser necessario ajustar migrations especificas para rodar em H2.
# spring.datasource.url=jdbc:h2:mem:marcosmusic_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
