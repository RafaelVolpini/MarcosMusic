## ── Perfil PROD — Postgres do Railway ────────────────────────────────────
## Toda a conexão vem de variáveis de ambiente injetadas pelo Railway
## (aba Variables do serviço). Nada aqui é hardcoded.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## HikariCP — evita conexões mortas após idle
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

## URL do frontend em produção (usada no link de reset de senha enviado por email)
app.frontend.url=${APP_FRONTEND_URL}

## CORS liberado só para o domínio de produção do frontend — via env var, sem default
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
