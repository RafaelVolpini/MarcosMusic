## Perfil ativo: "dev" por padrao localmente; o Railway injeta SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

## Porta — o Railway injeta PORT automaticamente e espera que a app escute nela
server.port=${PORT:8080}

## Config flyway (comum aos dois perfis; a URL/credenciais do banco ficam em application-{dev,prod}.properties)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

## Upload de videoaulas
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

## JWT — o segredo real SEMPRE vem de variavel de ambiente.
## Sem default aqui de proposito: se JWT_SECRET nao estiver setado em prod, a app falha ao subir
## (fail-fast) em vez de rodar com um segredo fraco. O perfil dev define um valor de teste.
jwt.secret=${JWT_SECRET}

## Azure Blob Storage (upload de videoaulas) — sem segredo hardcoded
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:data}

## SMTP — Brevo (gere a SMTP key em app.brevo.com > SMTP & API > SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
