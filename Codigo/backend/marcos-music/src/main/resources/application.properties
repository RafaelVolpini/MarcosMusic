## Banco de dados
spring.datasource.url=jdbc:sqlserver://marcos-music-server.database.windows.net:1433;database=marcos-music-db
spring.datasource.username=marcosmusicadmin
spring.datasource.password=Admin123

## HikariCP  evita conexões mortas após suspensão/idle no Azure SQL
## max-lifetime < Azure's idle kill window (~4-5 min); keepalive < max-lifetime
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

## Config flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

